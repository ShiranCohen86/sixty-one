:root{
  --bg:#FFFFFF;--surface:#F1F5FD;--surface2:#E3EBFA;--ink:#0A1F5C;--muted:#4D5E87;--line:#C8D5F0;
  --flag:#0038B8;--accent:#0038B8;--accent-soft:#DCE6FB;--on-accent:#FFFFFF;
  --good:#17754A;--good-soft:#DDF1E6;--warn:#8F5400;--warn-soft:#F8EBD3;--bad:#B42318;--bad-soft:#F9E0DD;
  --shadow:0 12px 32px rgba(10,31,92,.16);--scrim:rgba(10,31,92,.42);
  color-scheme:light;
}
html,body{background:var(--bg);height:100%}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
html[data-tsize="s"] body{font-size:clamp(13px,3.2vw,15px)}
html[data-tsize="l"] body{font-size:clamp(17px,4.4vw,19px)}
html[data-reduce-motion="1"] *{animation:none!important;transition:none!important}
#app::before,#app::after{content:"";display:block;height:30px;background:linear-gradient(to bottom,#fff 0 6px,var(--flag) 6px 16px,#fff 16px)}
#app::after{transform:scaleY(-1)}
.flag{display:block;width:112px;height:auto;filter:drop-shadow(0 4px 10px rgba(10,31,92,.18));border-radius:3px}
.flag.sm{width:44px;filter:none;box-shadow:0 0 0 1px var(--line)}
body{color:var(--ink);font-family:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;font-size:clamp(15px,3.6vw,17px);line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
*{box-sizing:border-box}
.wrap{width:100%;max-width:560px;margin:0 auto;padding-inline:clamp(14px,4vw,24px);padding-block:18px 48px;display:flex;flex-direction:column;gap:clamp(14px,3vw,20px)}
.cols{display:grid;gap:inherit;min-width:0}
.cols > *{min-width:0;display:grid;gap:inherit;align-content:start}
.display{font-family:"Frank Ruhl Libre","David Libre",Georgia,serif;font-weight:900;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* intro */
.hero{display:grid;gap:6px;justify-items:center;text-align:center;padding-top:8px}
.hero .big{font-size:clamp(88px,26vw,170px);line-height:.85;color:var(--accent)}
.hero h1{font-size:28px}
.hero p{max-width:34ch;color:var(--muted)}
.hemi{width:100%;max-width:min(100%,460px);margin:0 auto;display:block}
.hemi-box{position:relative;display:grid;justify-items:center}
.hemi-label{position:absolute;inset-inline:0;bottom:2%;text-align:center;line-height:1}
.hemi-label .n{font-size:clamp(34px,11vw,52px)}
.hemi-label .of{font-size:14px;color:var(--muted);font-weight:700}
.cands{display:grid;grid-template-columns:1fr;gap:10px}
.cand{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;text-align:start;display:grid;gap:4px}
.cand[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.cand .who{font-weight:800;font-size:17px;line-height:1.2}
.cand .sub{font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-inline-end:6px}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:800;font-size:17px;background:var(--accent);color:var(--on-accent);width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{padding:10px 14px;font-size:15px;width:auto}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 160px}
.rules{display:grid;gap:8px;background:var(--surface);border-radius:14px;padding:14px 16px;font-size:15px}
.rules li{margin:0}
.rules ul{margin:0;padding-inline-start:18px;display:grid;gap:4px}
.fine{font-size:12.5px;color:var(--muted);line-height:1.55}
.code-in{display:flex;gap:8px;align-items:center}
.code-in input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);direction:ltr;text-align:center;letter-spacing:.1em;text-transform:uppercase}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 0;text-decoration:underline;text-underline-offset:3px}

/* board */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:12px;padding:10px clamp(8px,2.5vw,14px);display:grid;gap:4px}
.stat .v{font-size:clamp(20px,6vw,28px);font-weight:800;line-height:1}
.stat .l{font-size:clamp(11px,3vw,12.5px);font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
.bar.low i{background:var(--bad)}
.commits{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.list,.cards{display:grid;gap:10px}
.cards{grid-template-columns:1fr;align-items:start}
.prow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 12px;text-align:start;width:100%;box-shadow:0 1px 3px rgba(10,31,92,.05)}
.prow:disabled{cursor:default;opacity:.62;background:var(--surface);box-shadow:none}
.prow .sw{width:14px;height:14px;border-radius:4px}
.prow .nm{font-weight:800;line-height:1.2}
.prow .meta{font-size:13px;color:var(--muted)}
.prow .seats{font-size:clamp(19px,5vw,23px);font-weight:800;min-width:2.2ch;text-align:center}
.prow{min-height:56px}
.btn,.opt,.cand{min-height:48px}
.prow.open:hover,.prow.open:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sect{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin-top:4px}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.logbox{max-height:180px;overflow-y:auto;display:grid;gap:5px;background:var(--surface);border-radius:12px;padding:10px 12px}
.logrow{font-size:13px;display:flex;gap:6px;align-items:baseline}
.logrow b{font-weight:800;flex-shrink:0}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .18s ease-out}
.sheet{background:var(--bg);border-top:8px solid var(--flag);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding-inline:16px;padding-block:18px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;box-shadow:var(--shadow);animation:up .22s ease-out}
.sheet h2{font-size:clamp(20px,5.5vw,26px)}
.demand{background:var(--surface);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.demand .q{font-size:clamp(17px,4.6vw,20px);font-weight:700;line-height:1.35}
.opts{display:grid;gap:8px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;text-align:start;display:grid;gap:8px;width:100%}
.opt:hover{border-color:var(--accent)}
.opt .t{font-weight:800;font-size:16.5px;line-height:1.3}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.result{background:var(--surface);border-radius:14px;padding:16px;display:grid;gap:8px}
.result .head{font-size:22px}
.result ul{margin:0;padding-inline-start:18px;display:grid;gap:4px}
.mood{font-size:13px;font-weight:700}

/* swear / end */
.votes{display:grid;grid-template-columns:1fr;gap:10px;align-items:start}
.vrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:9px 12px;animation:up .3s ease-out both}
.endcard{background:linear-gradient(to bottom,#fff 0 10px,var(--flag) 10px 20px,var(--surface) 20px);border-radius:18px;padding:36px 18px 20px;display:grid;gap:10px;text-align:center;justify-items:center}
.endcard .title{font-size:clamp(24px,7vw,32px);line-height:1.1}
.endcard .score{font-size:clamp(46px,14vw,68px);line-height:1;color:var(--accent)}
.break{width:100%;display:grid;gap:4px;font-size:14.5px;text-align:start}
.break div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-block:5px}
.sharebox{width:100%;font:inherit;font-size:14px;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);resize:none}

.seat{animation:pop .35s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.seat,.scrim,.sheet,.vrow{animation:none}.bar i{transition:none}}
@media (max-width:360px){.prow{padding:10px}.chip{font-size:11.5px;padding:2px 7px}.cand{padding:10px}}
@media (min-width:601px){.cards,.votes{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.cands{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){
  .ctabar{position:sticky;bottom:0;z-index:3;background:var(--bg);margin-inline:calc(-1 * clamp(14px,4vw,24px));padding-inline:clamp(14px,4vw,24px);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 14px -10px rgba(10,31,92,.18)}
  .wrap{padding-block-end:0}
}
@media (min-width:760px){
  .wrap{max-width:900px}
  .cols{grid-template-columns:minmax(0,360px) minmax(0,1fr);align-items:start}
  .cols > .col-a{position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
  .scrim{align-items:center;padding:24px}
  .sheet{border-radius:20px;border-top-width:10px;max-width:640px;max-height:86vh;padding-block:20px 22px;animation:fade .18s ease-out}
  .hero .big{font-size:150px}
}

const coalSeats=()=>active().filter(p=>inCoal(p.id)).reduce((a,p)=>a+S.seats[p.id],0);
function blockedBy(id){
  if(byId[id].never) return 'לא חלק מהמשחק הקואליציוני';
  for(const [a,b] of REDS){const o=a===id?b:b===id?a:null; if(o&&inCoal(o)) return 'לא יושבת עם '+byId[o].short;}
  return null;
}
const isOpen=id=>S.ps[id].st==='open'&&!blockedBy(id);
function canReach(ex){
  const base=coalSeats();const inIds=active().filter(p=>inCoal(p.id)).map(p=>p.id);
  const pool=active().filter(p=>p.id!==ex&&isOpen(p.id)).map(p=>p.id);
  for(let m=0;m<(1<<pool.length);m++){const ids=inIds.slice();let s=base;pool.forEach((id,i)=>{if(m>>i&1){ids.push(id);s+=S.seats[id]}});if(s>=61&&redOk(ids))return true}
  return false;
}
const pivotal=id=>coalSeats()<61&&canReach(null)&&!canReach(id);
function chance(o,id){return Math.max(.05,Math.min(.95,o.base+.3*(S.ps[id].sat-50)/50-(pivotal(id)?.15:0)+(DIFF_ADJ[S.diff]||0)))}
const chanceWord=p=>p>=.65?['גבוה','good']:p>=.4?['בינוני','warn']:['נמוך','bad'];
function moodOf(sat){return sat>=75?['נלהבת','good']:sat>=50?['פתוחה','acc']:sat>=30?['קרירה','warn']:['עוינת','bad']}

/* ---------- negotiation ---------- */
function previewTags(o,id){
  const t=[];
  if(o.refuse){t.push(['בלף או פיצוץ','warn']);return t}
  if(o.sure)t.push(['חתימה בטוחה','good']);else{const [w,c]=chanceWord(chance(o,id));t.push(['סיכוי '+w,c])}
  (o.ports||[]).forEach(x=>{const h=S.ports[x];t.push(['תיק: '+x,SENIOR.includes(x)?'acc':''])
    if(h&&h!==id)t.push([x+' כבר הובטח ל'+byId[h].short,'bad'])});
  if(o.rot)t.push([o.rot==='them'?'רוטציה: הם ראשונים':'רוטציה: את/ה ראשון/ה',o.rot==='them'?'bad':'warn']);
  if(o.trust)t.push(['אמון הציבור '+(o.trust>0?'+':'')+o.trust,o.trust<0?'bad':'good']);
  for(const k in (o.issue||{})){const v=o.issue[k];t.push([ISSUES[k].name+': '+ISSUES[k][v],'']);
    if(S.commits[k]&&S.commits[k]!==v)t.push(['סותר הבטחה קודמת','bad']);
    for(const p of active()){ if(p.id===id||!inCoal(p.id)||p.id===S.cand) continue; const c=p.cares[k]; if(!c||c===v) continue;
      t.push(S.ps[p.id].firm.includes(k)?[p.short+' תפרוש','bad']:[p.short+' תתרעם','warn'])}
  }
  if(!o.ports&&!o.issue&&!o.rot&&!o.refuse)t.push(['בלי תיק','']);
  return t;
}
function leave(id,msgs,why){S.ps[id].st='gone';msgs.push([byId[id].short+' '+(S.ps[id].wasSigned?'פורשת מהקואליציה':'מפסיקה את המשא ומתן')+(why?': '+why:'.'),'bad']);beep(220,.18);buzz([0,30,30,30])}
function commitIssue(k,v,src,msgs){
  if(S.commits[k]&&S.commits[k]!==v){S.trust-=8;msgs.push(['זיגזג: הבטחת קודם '+ISSUES[k][S.commits[k]]+'. אמון הציבור יורד.','bad'])}
  S.commits[k]=v;
  for(const p of active()){ if(p.id===src||p.id===S.cand) continue; const c=p.cares[k]; if(!c||c===v) continue; const q=S.ps[p.id];
    if(q.st==='signed'){ if(q.firm.includes(k)) leave(p.id,msgs,'הבטחת לה '+ISSUES[k][c]+'.');
      else{q.sat-=25; if(q.sat<40) leave(p.id,msgs,'היא דרשה '+ISSUES[k][c]+'.'); else msgs.push([p.short+' מתרעמת, אבל נשארת.','warn'])}}
    else if(q.st==='open'){q.sat-=20; if(q.sat<15) leave(p.id,msgs,'היא דורשת '+ISSUES[k][c]+'.'); else msgs.push([p.short+' מתקררת בגלל ההתחייבות.','warn'])}
  }
}
function sign(id,o,msgs){
  const q=S.ps[id];
  for(const x of (o.ports||[])){const h=S.ports[x]; if(h&&h!==id&&inCoal(h)) S.doubles.push({x,first:h,second:id}); S.ports[x]=id;}
  if(o.rot) S.rot=o.rot;
  q.st='signed';q.wasSigned=true;q.sat=Math.min(100,Math.max(q.sat,50)+15);q.firm=Object.keys(o.issue||{});
  msgs.unshift([byId[id].short+' חותמת על הסכם קואליציוני. +'+S.seats[id]+' מנדטים.','good']);
  beep(880,.1);buzz(12);
  if(o.trust){S.trust+=o.trust;msgs.push(['אמון הציבור '+(o.trust>0?'+':'')+o.trust+'.',o.trust<0?'warn':'good']);}
  for(const k in (o.issue||{})) commitIssue(k,o.issue[k],id,msgs);
}
function resolve(id,idx){
  const p=byId[id],q=S.ps[id],o=cardOf(id).opts[idx],msgs=[];
  const cost=3+Math.floor(rand()*3);S.days-=cost;S.meetings++;
  let head,tone;
  const HD={bluff:['הם בלפו.','הבלוף התפוצץ להם בפנים.','הם ויתרו בלי לקבל כלום.'],
    walk:['הם קמים מהשולחן.','הדלת נטרקה.','הפגישה נגמרה בצעקות.'],
    sure:['סגרנו.','חתמו על ההסכם.','זה נסגר בלחיצת יד.'],
    win:['זה עבד.','הם התקפלו.','אחרי שעתיים, סגרנו.'],
    lose:['לא הסכימו.','הם קמו בלי לחתום.','הפגישה נגמרה בכלום.']};
  if(o.refuse){
    if(rand()<p.bluff*q.sat/100){head=pick(HD.bluff);tone='good';sign(id,{},msgs);msgs.push(['חתמו בלי לקבל כלום.','good'])}
    else{q.sat-=25;head=pick(HD.walk);tone='bad'; if(q.sat<25) leave(id,msgs); else msgs.push(['אפשר לנסות שוב, אבל הם כועסים.','warn'])}
  }else if(o.sure||rand()<chance(o,id)){head=pick(o.sure?HD.sure:HD.win);tone='good';sign(id,o,msgs)}
  else{q.sat-=12;head=pick(HD.lose);tone='bad'; if(q.sat<15) leave(id,msgs); else msgs.push(['הם עדיין ליד השולחן. אפשר לנסות שוב.','warn'])}
  S.sheet={kind:'result',id,head,tone,msgs,cost};
  S.log.unshift({who:byId[id].short,head,tone});if(S.log.length>40)S.log.length=40;
  render();
}

/* ---------- events ---------- */
function rivalId(){let best=null;
  for(const p of active()){ if(p.id===S.cand||p.id==='indy'||p.never||inCoal(p.id)) continue;
    if(!best||S.seats[p.id]>S.seats[best]) best=p.id }
  return best}
function pickEvent(){
  const E=[],open=active().filter(p=>isOpen(p.id)),signed=active().filter(p=>S.ps[p.id].st==='signed'&&p.id!=='indy');
  const dbl=S.doubles.find(d=>!d.done&&inCoal(d.first));
  if(dbl) E.push({w:6,run(){dbl.done=true;const f=byId[dbl.first],q=S.ps[f.id],msgs=[];S.trust-=6;q.sat-=30;
    if(q.sat<40) leave(f.id,msgs,'גילתה שהבטחת את תיק '+dbl.x+' גם ל'+byId[dbl.second].short+'.'); else msgs.push([f.short+' זועמת, אבל נשארת. בינתיים.','warn']);
    return {title:'"הבטיח פעמיים, וחשב שלא יתפסו"',text:'צילום מסך של שתי טיוטות הסכם עלה לרשת: תיק '+dbl.x+' הובטח גם ל'+f.short+' וגם ל'+byId[dbl.second].short+'. הפאנלים בסטודיו כבר מדברים על "שיטת העבודה".',msgs}}});
  const weak=signed.filter(p=>S.ps[p.id].sat<75);
  if(weak.length&&!S.evDone.includes('steal')) E.push({w:3,key:'steal',run(){const p=weak[Math.floor(rand()*weak.length)];
    return {title:'"פגישה חשאית במלון בירושלים"',text:'צלם תפס את אנשי '+p.short+' יוצאים מפגישה עם המחנה היריב בשתיים בלילה. בלשכה מכחישים. הם מחכים לשמוע ממך עד הערב.',choice:[
      {t:'משווים את ההצעה',tag:'אמון הציבור יורד',go(){S.trust-=6;S.ps[p.id].sat+=15;return [[p.short+' נשארת.','good']]}},
      {t:'לא נכנעים לסחטנות',tag:'סיכוי שתעזוב',go(){const m=[];if(rand()<.5) leave(p.id,m,'קיבלה את ההצעה של היריב.'); else {S.ps[p.id].sat-=10;m.push([p.short+' נשארת, ממורמרת.','warn'])}return m}}]}}});
  if(open.length&&!S.evDone.includes('poll')) E.push({w:2,key:'poll',run(){const p=open[Math.floor(rand()*open.length)];S.ps[p.id].sat-=12;
    return {title:'סקר: "'+p.short+' חוגגת"',text:'סקר מיוחד מראה ש'+p.short+' תתחזק בבחירות חוזרות. מאז הפרסום הצוות שלהם עונה לטלפון פעם בשעתיים.',msgs:[[p.short+' פחות מתפשרת.','warn']]}}});
  if(!S.evDone.includes('sec')) E.push({w:2,key:'sec',run(){S.days-=3;S.trust+=4;return {title:'הקבינט מתכנס בלילה',text:'אירוע ביטחוני בצפון עוצר הכל. המשא ומתן מוקפא לשלושה ימים, והמצלמות עברו לגבול.',msgs:[['−3 ימים. הציבור מתלכד: אמון +4.','warn']]}}});
  const rv=rivalId();
  if(rv&&S.ps[rv]&&S.ps[rv].st==='open'&&!S.evDone.includes('pres')) E.push({w:2,key:'pres',run(){S.ps[rv].sat+=20;return {title:'"הנשיא איבד סבלנות"',text:'בית הנשיא פרסם קריאה חריגה להקים ממשלה רחבה. מקורבים מספרים על שיחת טלפון לא נעימה. '+byId[rv].short+' פתאום מוכנה לדבר.',msgs:[[byId[rv].short+' פתוחה יותר לאחדות.','good']]}}});
  if(rv&&S.ps[rv]&&S.seats[rv]>6&&!S.seats.indy&&!S.evDone.includes('indy')) E.push({w:2,key:'indy',run(){S.seats[rv]--;S.seats.indy=1;S.ps.indy={sat:70,st:'signed',wasSigned:true,firm:[]};
    return {title:'"הבוקר הוא עוד היה שם"',text:'ח״כ מ'+byId[rv].short+' פרש לסיעת יחיד והודיע שיתמוך בממשלה שלך. בסיעה שלו מדברים על "תפקיד שהובטח". אצלך מכחישים.',msgs:[['+1 מנדט לקואליציה.','good']]}}});
  if(!S.evDone.includes('demo')) E.push({w:1,key:'demo',run(){S.trust-=5;return {title:'"הרחוב רותח"',text:'אלפים מול הכנסת נגד ההסכמים המתגבשים. שידור חי בכל הערוצים, וסקר מהיר שאומר שרוב הציבור לא אוהב את מה שהוא רואה.',msgs:[['אמון הציבור −5.','bad']]}}});
  if(open.length&&!S.evDone.includes('night')) E.push({w:1,key:'night',run(){open.forEach(p=>S.ps[p.id].sat+=6);return {title:'"הצטלמו יחד. מה קרה שם?"',text:'תמונה משיחה ארוכה בלילה עולה לרשת, וכולם בה מחייכים. הפרשנים לא מצליחים להסביר, והטלפונים אצלך מתחילים לצלצל.',msgs:[['כל המפלגות הפתוחות מתחממות.','good']]}}});
  if(!S.evDone.includes('tv')) E.push({w:2,key:'tv',run(){S.trust-=4;
    return {title:'"אמרת \'לא\' ואז \'כן\' באותו משפט"',text:'קטע של 20 שניות מהריאיון שלך רץ ברשת עם מוזיקה. אפילו מי שמסכים איתך משתף אותו.',msgs:[['אמון הציבור −4.','bad']]}}});
  if(signed.length&&!S.evDone.includes('selfie')) E.push({w:2,key:'selfie',run(){const p=signed[Math.floor(rand()*signed.length)];S.ps[p.id].sat+=10;S.trust-=3;
    return {title:'"הסלפי ששבר את הרשת"',text:'עוזר פרסם בטעות תמונה שלך עם אנשי '+p.short+' וקנקן לימונדה. אצלם מרוצים. אצל הבוחרים שלך פחות.',msgs:[[p.short+' מרוצה מהחיבוק הציבורי.','good'],['אמון הציבור −3.','warn']]}}});
  if(open.length&&!S.evDone.includes('leakdoc')) E.push({w:2,key:'leakdoc',run(){const p=open[Math.floor(rand()*open.length)];S.ps[p.id].sat-=8;
    return {title:'"הטיוטה שדלפה לאולפן"',text:'הפרוטוקול מהפגישה עם '+p.short+' הגיע לשולחן של פרשן בכיר, כולל המשפט שלא היה אמור לצאת מהחדר.',msgs:[[p.short+' פחות סומכת עליך.','warn']]}}});
  if(!S.evDone.includes('rumor')) E.push({w:1,key:'rumor',run(){S.days-=2;
    return {title:'"מי הדליף את זה?"',text:'יומיים שלמים נשרפו על ציד המדליף בלשכה. לא נמצא. הפגישות נדחו.',msgs:[['−2 ימים.','warn']]}}});
  if(S.trust<35&&open.length&&!S.evDone.includes('lowtrust')) E.push({w:2,key:'lowtrust',run(){const p=open[Math.floor(rand()*open.length)];S.ps[p.id].sat-=10;
    return {title:'"ממשלה שאין לה מי שמאמין בה"',text:'סקר אמון פומבי מראה שרוב הציבור לא בטוח שתצליח/י להרכיב ממשלה יציבה. הצוותים שמסביב לשולחן שמים לב.',msgs:[[p.short+' מרגישה שהיא לא חייבת למהר.','warn']]}}});
  const gapToMaj=61-coalSeats();
  if(gapToMaj>0&&gapToMaj<=3&&open.length&&!S.evDone.includes('closerace')) E.push({w:2,key:'closerace',run(){const p=open[Math.floor(rand()*open.length)];S.ps[p.id].sat+=8;
    return {title:'"שלושה מנדטים מהקו"',text:'כל הפרשנים סופרים את אותם המספרים: את/ה קרוב/ה ל-61 באופן שקשה להתעלם ממנו. הלחץ הציבורי על המהססים גובר.',msgs:[[p.short+' מרגישה שהיא עלולה להיתפס כמי שמפילה ממשלה סתם.','good']]}}});
  if(!S.evDone.includes('econ')) E.push({w:1,key:'econ',run(){S.trust+=3;
    return {title:'"השווקים רגועים"',text:'מדד המניות המקומי נסגר ביציבות, ובכלכלנים בטלוויזיה מסבירים שהשוק "מתמחר כניסה יחסית מהירה לממשלה". רגיעה זמנית.',msgs:[['אמון הציבור +3.','good']]}}});
  let tot=E.reduce((a,e)=>a+e.w,0),x=rand()*tot;
  for(const e of E){x-=e.w;if(x<=0){if(e.key)S.evDone.push(e.key);return e.run()}}
  return null;
}
function afterSheet(){
  S.sheet=null;
  S.trust=Math.max(0,Math.min(100,S.trust));
  if(S.days<=0) return deadline();
  if([2,4,7,10].includes(S.meetings)&&!S.evFor?.includes(S.meetings)&&rand()<.8){
    (S.evFor=S.evFor||[]).push(S.meetings);
    const ev=pickEvent(); if(ev){S.sheet={kind:'event',...ev};S.log.unshift({who:'בינתיים',head:ev.title,tone:''});if(S.log.length>40)S.log.length=40;return render()}
  }
  if(coalSeats()<61&&!canReach(null)){S.sheet={kind:'dead'};return render()}
  render();
}
function deadline(){
  if(coalSeats()>=61){S.sheet={kind:'info',title:'הזמן נגמר',text:'יש לך רוב. הולכים להשבעה.',next:'swear'};return render()}
  if(!S.ext){S.ext=true;S.days+=14;S.trust-=4;S.sheet={kind:'info',title:'הארכה',text:'הנשיא מאריך את המנדט ב-14 ימים. זו ההארכה האחרונה.',next:'board'};return render()}
  endGame(false,'המנדט חזר לנשיא');
}

/* ---------- swear & end ---------- */
function goSwear(){
  const rows=[];let yes=0,no=0;
  for(const p of active()){ if(!inCoal(p.id)) continue; const q=S.ps[p.id],n=S.seats[p.id];
    let d=0; if(p.id!==S.cand){const pr=Math.max(0,(60-q.sat)/100)*(1-p.rel)*2+(S.trust<35?.1:0); if(rand()<pr) d=1}
    yes+=n-d;no+=d;rows.push({p,yes:n-d,d});
  }
  S.swear={rows,yes,no};S.screen='swear';S.sheet=null;render();
}
function endGame(ok,reason){
  if(ok){beep(880,.12);setTimeout(()=>beep(1100,.15),140);buzz(20)}else{beep(180,.3);buzz([0,60,40,60])}
  const seats=ok?S.swear.yes:coalSeats();
  let score=0,br=[],title;
  if(ok){
    const senior=SENIOR.filter(x=>!S.ports[x]).length;
    br=[['הרכבת ממשלה',400],['רוב של '+seats,Math.min(seats-61,10)*20],['אמון הציבור '+S.trust,S.trust*2],['תיקים בכירים שנשארו אצלך: '+senior,senior*50],['ימים שנותרו: '+Math.max(0,S.days),Math.min(Math.max(0,S.days),20)*5]];
    if(S.rot) br.push([S.rot==='them'?'רוטציה, היריב ראשון':'רוטציה, את/ה ראשון/ה',S.rot==='them'?-250:-100]);
    score=br.reduce((a,b)=>a+b[1],0);
    title=S.rot==='them'?'ממשלת רוטציה':S.rot==='me'?'ממשלת אחדות':seats>=70?'ממשלה רחבה':seats<=62?'61 ותפילה':S.trust<35?'ממשלה בלי ציבור':'ממשלה יציבה';
  }else{title=reason||'בחירות חוזרות';br=[['לא הורכבה ממשלה',0]];}
  S.end={ok,title,score,br,seats};S.screen='end';S.sheet=null;render();
}

function resolveBudget(){
  const margin=coalSeats()-61;
  const p=Math.max(.05,Math.min(.95,.5+margin*.02+(S.s2.stab-100)*.006+(S.s2.trust-60)*.004));
  const ok=rand()<p;
  const legacy=ok?Math.round(200+margin*5+(S.s2.stab-100)*2+(S.s2.trust-60)*3):Math.round(40+S.s2.stab*.5);
  let title;
  if(ok) title=S.s2.stab>=110?'קואליציה מגובשת אחרי 100 יום':S.s2.stab>=85?'ממשלה מתפקדת':'ממשלה רועדת, אך עומדת';
  else title='התקציב נפל — לקראת בחירות';
  if(ok){beep(700,.12);setTimeout(()=>beep(950,.14),130);buzz(15)}else{beep(160,.28);buzz([0,50,40,50])}
  S.s2.end={ok,title,score:legacy};S.screen='stage2end';render();
}

/* ---------- hemicycle ---------- */
const SEATPOS=(()=>{const rows=6,r0=42,r1=94,rs=[];for(let i=0;i<rows;i++)rs.push(r0+(r1-r0)*i/(rows-1));
  const sum=rs.reduce((a,b)=>a+b,0);let cnt=rs.map(r=>Math.round(120*r/sum));cnt[rows-1]+=120-cnt.reduce((a,b)=>a+b,0);
  const out=[];rs.forEach((r,i)=>{const n=cnt[i];for(let j=0;j<n;j++){const a=Math.PI-j*Math.PI/(n-1);out.push({a,x:100+r*Math.cos(a),y:100-r*Math.sin(a)})}});
  out.sort((p,q)=>q.a-p.a);return out})();
function hemi(mode,animate){
  const order=P.filter(p=>S.seats[p.id]).sort((a,b)=>a.pos-b.pos);const cols=[];
  for(const p of order){const st=S.ps[p.id]?.st;const op=mode==='all'||st==='self'||st==='signed'?1:(st==='open'&&!blockedBy(p.id))?.32:.12;for(let i=0;i<S.seats[p.id];i++)cols.push([p.color,op])}
  let s='<svg class="hemi" viewBox="0 0 200 104" role="img" aria-label="מליאת הכנסת: '+coalSeats()+' מתוך 120 מושבים בקואליציה">';
  SEATPOS.forEach((pt,i)=>{const c=cols[i]||['#999',.2];s+=`<circle class="${animate?'seat':''}" style="${animate?'animation-delay:'+(i*9)+'ms;':''}transform-origin:${pt.x}px ${pt.y}px" cx="${pt.x.toFixed(2)}" cy="${pt.y.toFixed(2)}" r="3.7" fill="${c[0]}" fill-opacity="${c[1]}"/>`});
  return s+'</svg>';
}

/* ---------- flag ---------- */
function flag(cls){
  const cx=110,cy=80,r=30,pt=(a,rr)=>[(cx+rr*Math.sin(a)).toFixed(2),(cy-rr*Math.cos(a)).toFixed(2)].join(',');
  const tri=o=>[0,1,2].map(i=>pt(o+i*2*Math.PI/3,r)).join(' ');
  return `<svg class="flag ${cls||''}" viewBox="0 0 220 160" role="img" aria-label="דגל ישראל"><rect width="220" height="160" fill="#fff"/><rect y="15" width="220" height="25" fill="#0038B8"/><rect y="120" width="220" height="25" fill="#0038B8"/><g fill="none" stroke="#0038B8" stroke-width="5.5" stroke-linejoin="miter"><polygon points="${tri(0)}"/><polygon points="${tri(Math.PI)}"/></g></svg>`;
}

function wrapText(x,text,cx,y,maxW,lh){
  const words=text.split(' ');let line='',lines=[];
  for(const w of words){const t=line?line+' '+w:w; if(x.measureText(t).width>maxW&&line){lines.push(line);line=w} else line=t}
  if(line)lines.push(line);
  const startY=y-((lines.length-1)*lh)/2;
  lines.forEach((l,i)=>x.fillText(l,cx,startY+i*lh));
}

  let body='';
  if(sh.kind==='meet'){const p=byId[sh.id],q=S.ps[sh.id],[m,c]=moodOf(q.sat);
    const hint=!S.hintShown?`<p class="fine" style="background:var(--surface);border-radius:10px;padding:10px 12px">איך קוראים את האפשרויות: "חתימה בטוחה" נסגרת תמיד. "סיכוי" גבוה/בינוני/נמוך עלול להיכשל, והפגישה תישאר פתוחה לניסיון נוסף. "בלף או פיצוץ" עלול לסגור הסכם בלי לקבל כלום — או לגרום להם לקום מהשולחן.</p>`:'';
    S.hintShown=true;
    body=`<div class="row" style="justify-content:space-between;align-items:center"><div><div class="eyebrow">פגישה · ${S.seats[p.id]} מנדטים</div><h2 class="display">${p.name}</h2></div>${chip(['מצב רוח: '+m,c])}</div>
     ${hint}
     <div class="demand"><span class="eyebrow">צוות המשא ומתן דורש ${cardOf(p.id).news?'<span class="chip warn">מהחדשות</span>':''}</span><div class="q">${esc(cardOf(p.id).demand)}</div>${cardOf(p.id).why?`<p class="muted" style="font-size:14.5px;border-inline-start:3px solid var(--line);padding-inline-start:10px">${esc(cardOf(p.id).why)}</p>`:''}${pivotal(p.id)?'<span class="chip bad" style="justify-self:start">הם יודעים שבלעדיהם אין לך 61</span>':''}</div>
     <div class="opts">${cardOf(p.id).opts.map((o,i)=>`<button class="opt" data-act="pick" data-i="${i}"><span class="t">${esc(o.t)}</span><span class="tags">${previewTags(o,p.id).map(chip).join('')}</span></button>`).join('')}</div>
     <button class="btn ghost" data-act="close">עוד לא. חזרה ללוח</button>`;}
  else if(sh.kind==='result'){body=`<div class="result"><div class="eyebrow">${byId[sh.id].name} · עברו ${sh.cost} ימים</div><div class="head display" style="color:var(--${sh.tone})">${sh.head}</div>
     <ul>${sh.msgs.map(([t,c])=>`<li style="color:var(--${c==='good'?'ink':c})">${esc(t)}</li>`).join('')}</ul></div><button class="btn" data-act="after">המשך</button>`;}
  else if(sh.kind==='event'){body=`<div class="result"><div class="eyebrow">בינתיים</div><div class="head display">${esc(sh.title)}</div><p>${esc(sh.text)}</p>
     ${sh.msgs?`<ul>${sh.msgs.map(([t,c])=>`<li style="color:var(--${c==='good'?'ink':c})">${esc(t)}</li>`).join('')}</ul>`:''}</div>
     ${sh.choice?`<div class="opts">${sh.choice.map((o,i)=>`<button class="opt" data-act="evpick" data-i="${i}"><span class="t">${esc(o.t)}</span><span class="tags">${chip([o.tag,'warn'])}</span></button>`).join('')}</div>`:`<button class="btn" data-act="evdone">המשך</button>`}`;}
  else if(sh.kind==='info'){body=`<div class="result"><div class="head display">${esc(sh.title)}</div><p>${esc(sh.text)}</p></div><button class="btn" data-act="info">המשך</button>`;}
  else if(sh.kind==='dead'){body=`<div class="result"><div class="head display" style="color:var(--bad)">אין דרך ל-61</div><p>עם המפלגות שנשארו ליד השולחן, אי אפשר להגיע לרוב.</p></div><button class="btn" data-act="giveup">להחזיר את המנדט</button>`;}
  return `<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">${body}</div></div>`;
}
function renderSwear(){
  const w=S.swear;
  return `<div class="wrap"><div><div class="eyebrow">מליאת הכנסת · הצבעת אמון</div><h1 class="display" style="font-size:30px">ההשבעה</h1></div>
   <div class="votes">${w.rows.map((r,i)=>`<div class="vrow" style="animation-delay:${i*160}ms"><span class="sw" style="width:14px;height:14px;border-radius:4px;background:${r.p.color}"></span><span><b>${r.p.name}</b>${r.d?` <span class="chip bad">ח״כ אחד לא הגיע</span>`:''}</span><span class="num" style="font-weight:800">${r.yes} בעד</span></div>`).join('')}</div>
   <div class="endcard"><div class="eyebrow">בעד הממשלה</div><div class="score display num" style="color:${w.yes>=61?'var(--good)':'var(--bad)'}">${w.yes}</div><div class="muted">${w.yes>=61?'יש רוב. הממשלה מושבעת.':'אין רוב. הממשלה נפלה במליאה.'}</div></div>
   <div class="ctabar"><button class="btn" data-act="toend">${w.yes>=61?'לתוצאה':'לתוצאה'}</button></div></div>`;
}
function renderEnd(){
  const e=S.end,me=byId[S.cand];
  const share=(e.ok?`הרכבתי ממשלה של ${e.seats} ח״כים בתור ${me.name} ב"שישים ואחת": ${e.title}, ${e.score} נקודות. קוד ההגרלה: ${S.code}. תנסו לעקוף.`:`ניסיתי להרכיב ממשלה ב"שישים ואחת" ונכשלתי: ${e.title}. קוד ההגרלה: ${S.code}. תנסו אתם.`)+`\n${SITE_URL}`;
  const given=Object.entries(S.ports).filter(([x,id])=>inCoal(id)).map(([x,id])=>x+' ← '+byId[id].short);
  const commitsList=Object.entries(S.commits).map(([k,v])=>ISSUES[k].name+': '+ISSUES[k][v]);
  const rotLine=S.rot?[S.rot==='them'?'רוטציה: היריב ראשון':'רוטציה: את/ה ראשון/ה']:[];
  return `<div class="wrap">
   <div class="endcard">${e.ok?flag("sm"):""}<div class="eyebrow">${me.name} · ${S.seats[S.cand]} מנדטים</div><div class="title display" style="color:${e.ok?'var(--ink)':'var(--bad)'}">${esc(e.title)}</div>
    ${e.ok?`<div class="score display num">${e.score}</div><div class="muted">נקודות</div>`:`<p class="muted">${coalSeats()} חתומים כשהזמן נגמר.</p>`}
    <div class="hemi-box" style="width:100%">${hemi('coal')}</div>
    <div class="break">${e.br.map(([t,v])=>`<div><span>${esc(t)}</span><b class="num" dir="ltr">${v>0?'+':''}${v}</b></div>`).join('')}</div>
    ${(given.length||commitsList.length||rotLine.length)?`<div class="sect" style="align-self:start">סיכום ההסכמים</div>`:''}
    ${given.length?`<div class="fine" style="text-align:start;width:100%">חלוקת תיקים: ${esc(given.join(' · '))}</div>`:''}
    ${commitsList.length?`<div class="fine" style="text-align:start;width:100%">הבטחות מדיניות: ${esc(commitsList.join(' · '))}</div>`:''}
    ${rotLine.length?`<div class="fine" style="text-align:start;width:100%">${esc(rotLine[0])}</div>`:''}
   </div>
   ${e.ok?`<button class="btn" data-act="stage2start">להמשיך למאה הימים הראשונים ←</button>`:''}
   <div class="row"><button class="btn ${e.ok?'ghost':''}" data-act="again">הגרלה חדשה</button><button class="btn ghost" data-act="other">אותה הגרלה, מפלגה אחרת</button></div>
   <div style="display:grid;gap:8px"><div class="sect">לשתף</div><textarea id="sharetxt" class="sharebox" rows="3" readonly>${esc(share)}</textarea>
     <div class="row"><button class="btn ghost small" data-act="copy" id="copybtn">${navigator.share?'שיתוף':'העתקה'}</button><button class="btn ghost small" data-act="shareimg" id="imgbtn">תמונה לשיתוף</button></div></div>
  </div>`;
}
function renderStage2(){
  const ev=STAGE2[S.s2.i];
  return `<div class="wrap">
   <div><div class="eyebrow">מאה הימים הראשונים · משבר ${S.s2.i+1} מתוך ${STAGE2.length}</div><h1 class="display" style="font-size:26px">${esc(ev.title)}</h1></div>
   <div class="stats">
     <div class="stat"><span class="l">אמון הציבור</span><span class="v num">${S.s2.trust}</span><div class="bar ${S.s2.trust<35?'low':''}"><i style="width:${S.s2.trust}%"></i></div></div>
     <div class="stat"><span class="l">יציבות קואליציונית</span><span class="v num">${S.s2.stab}</span><div class="bar ${S.s2.stab<60?'low':''}"><i style="width:${Math.min(100,S.s2.stab)}%"></i></div></div>
   </div>
   <div class="demand"><p>${esc(ev.text)}</p></div>
   <div class="opts">${ev.choices.map((c,i)=>`<button class="opt" data-act="s2pick" data-i="${i}"><span class="t">${esc(c.t)}</span><span class="tags">${chip([c.tag,''])}</span></button>`).join('')}</div>
  </div>`;
}
function renderStage2End(){
  const r=S.s2.end,me=byId[S.cand];
  return `<div class="wrap">
   <div class="endcard">${r.ok?flag("sm"):""}<div class="eyebrow">${me.name} · מאה הימים הראשונים</div><div class="title display" style="color:${r.ok?'var(--ink)':'var(--bad)'}">${esc(r.title)}</div>
    <div class="score display num">${r.score}</div><div class="muted">ניקוד מאה הימים</div>
   </div>
   <div class="rules"><ul>${S.s2.log.map(l=>`<li><b>${esc(l.title)}:</b> ${esc(l.choice)}</li>`).join('')}</ul></div>
   <div class="row"><button class="btn" data-act="again">הגרלה חדשה</button><button class="btn ghost" data-act="other">אותה הגרלה, מפלגה אחרת</button></div>
  </div>`;
}

/* ---------- events wiring ---------- */
app.addEventListener('input',e=>{if(e.target.id==='codein')ui.code=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6)});
let lastSig=null,lastClickAt=0;
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  const now=Date.now(),sig=a+':'+(b.dataset.i??b.dataset.id??'');
  if(sig===lastSig&&now-lastClickAt<300) return; lastSig=sig;lastClickAt=now;
  try{
  if(a==='cand'){ui.cand=b.dataset.id;renderIntro();return}
  if(a==='showcode'){ui.showCode=true;renderIntro();setTimeout(()=>document.getElementById('codein')?.focus());return}
  if(a==='start'){const code=ui.code.length>=5?ui.code:newCode();newGame(code,ui.cand,ui.diff);scrollTo(0,0);return}
  if(a==='toboard'){S.screen='board';render();scrollTo(0,0);return}
  if(a==='meet'){S.sheet={kind:'meet',id:b.dataset.id};render();return}
  if(a==='close'){S.sheet=null;render();return}
  if(a==='pick'){const o=cardOf(S.sheet.id).opts[+b.dataset.i];
    const dbl=(o.ports||[]).some(x=>S.ports[x]&&S.ports[x]!==S.sheet.id&&inCoal(S.ports[x]));
    if(dbl&&!confirm('התיק הזה כבר הובטח למפלגה אחרת בקואליציה. להבטיח אותו גם ל'+byId[S.sheet.id].short+'?')) return;
    resolve(S.sheet.id,+b.dataset.i);return}
  if(a==='after'||a==='evdone'){afterSheet();return}
  if(a==='evpick'){const m=S.sheet.choice[+b.dataset.i].go();S.sheet={kind:'event',title:S.sheet.title,text:S.sheet.text,msgs:m};render();return}
  if(a==='info'){const n=S.sheet.next;S.sheet=null;if(n==='swear')goSwear();else afterSheet();return}
  if(a==='giveup'){endGame(false,'בחירות חוזרות');return}
  if(a==='swear'){goSwear();scrollTo(0,0);return}
  if(a==='toend'){endGame(S.swear.yes>=61,'הממשלה נפלה במליאה');scrollTo(0,0);return}
  if(a==='stage2start'){startStage2();scrollTo(0,0);return}
  if(a==='s2pick'){s2Pick(+b.dataset.i);scrollTo(0,0);return}
  if(a==='again'){ui.code='';ui.showCode=false;ui.cand=S.cand;S=null;renderIntro();scrollTo(0,0);return}
  if(a==='other'){ui.code=S.code;ui.showCode=true;ui.cand=null;S=null;renderIntro();scrollTo(0,0);return}
  if(a==='copy'){const t=document.getElementById('sharetxt');
    if(navigator.share){navigator.share({text:t.value}).catch(()=>{});return}
    t.select();let ok=false;
    try{navigator.clipboard.writeText(t.value).then(()=>{b.textContent='הועתק'},()=>{try{ok=document.execCommand('copy')}catch(_){};b.textContent=ok?'הועתק':'סמנו והעתיקו ידנית'})}catch(_){try{ok=document.execCommand('copy')}catch(__){};b.textContent=ok?'הועתק':'סמנו והעתיקו ידנית'}
    return}
  if(a==='reset'){try{localStorage.removeItem(SAVE_KEY)}catch(_){} S=null;ui={cand:null,showCode:false,code:'',settingsOpen:false,infoOpen:false,diff:'n',prefs:ui.prefs};render();return}
  if(a==='settings'){ui.settingsOpen=true;render();return}
  if(a==='closesettings'){ui.settingsOpen=false;render();return}
  if(a==='pref-motion'){ui.prefs.reduceMotion=!ui.prefs.reduceMotion;applyPrefs();savePrefs();render();return}
  if(a==='pref-sound'){ui.prefs.muted=!ui.prefs.muted;savePrefs();if(!ui.prefs.muted)beep(660,.08);render();return}
  if(a==='pref-size'){ui.prefs.textScale=b.dataset.v;applyPrefs();savePrefs();render();return}
  if(a==='howbuilt'){ui.infoOpen=true;render();return}
  if(a==='closeinfo'){ui.infoOpen=false;render();return}
  if(a==='diff'){ui.diff=b.dataset.v;renderIntro();return}
  if(a==='daily'){ui.code=dailyCode();ui.showCode=true;renderIntro();return}
  if(a==='shareimg'){
    const orig=b.textContent;b.disabled=true;b.textContent='מכינה תמונה…';
    makeShareImage().then(async url=>{
      try{
        if(navigator.canShare&&window.File){
          const blob=await (await fetch(url)).blob();
          const file=new File([blob],'sixty-one.png',{type:'image/png'});
          if(navigator.canShare({files:[file]})){await navigator.share({files:[file],text:document.getElementById('sharetxt').value});b.disabled=false;b.textContent=orig;return}
        }
        const a2=document.createElement('a');a2.href=url;a2.download='sixty-one.png';a2.click();
      }catch(_){}
      b.disabled=false;b.textContent=orig;
    }).catch(()=>{b.disabled=false;b.textContent=orig});
    return}
  }catch(err){console.error(err);render()}
});
app.addEventListener('keydown',e=>{
  if(e.key!=='Tab')return; const sheetEl=app.querySelector('.sheet'); if(!sheetEl)return;
  const f=[...sheetEl.querySelectorAll('button,input,[tabindex]')].filter(x=>!x.disabled);
  if(!f.length)return; const first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(ui.settingsOpen){ui.settingsOpen=false;render();return}
  if(ui.infoOpen){ui.infoOpen=false;render();return}
  if(!S||!S.sheet)return;
  const k=S.sheet.kind;
  if(k==='meet'){S.sheet=null;render()}
  else if(k==='result'||(k==='event'&&!S.sheet.choice)){afterSheet()}
  else if(k==='info'){const n=S.sheet.next;S.sheet=null;if(n==='swear')goSwear();else afterSheet()}
});

/* ---------- boot ---------- */
document.getElementById('gearbtn')?.addEventListener('click',()=>{ui.settingsOpen=true;render()});
function boot(d){
  applyPrefs();
  if(d&&d.S&&d.S.screen){S=d.S;ui.cand=d.ui?.cand??ui.cand;render();return}
  const saved=loadState();
  if(saved&&saved.S&&saved.S.screen){S=saved.S;ui.cand=saved.ui?.cand??ui.cand;render()}
  else renderIntro();
}
window.claude?.hot?.snapshot?.(()=>({S,ui}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
